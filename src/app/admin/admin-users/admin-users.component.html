<section class="admin-page">
  <header>
    <h1>Gestion des utilisateurs</h1>
    <button pButton type="button" label="Nouvel utilisateur" icon="pi pi-plus" (click)="openNew()"></button>
  </header>

  <div class="admin-table-wrapper">
  <p-table
    [value]="users()"
    [loading]="loading()"
    responsiveLayout="scroll"
    [lazy]="true"
    [paginator]="true"
    [rows]="rows()"
    [first]="(currentPage() - 1) * rows()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} utilisateurs"
    [showCurrentPageReport]="true"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Telephone</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
      <tr class="filter-row">
        <th colspan="3">
          <span class="p-input-icon-left inline-search">
            <i class="pi pi-search"></i>
            <input
              pInputText
              type="text"
              placeholder="Rechercher par nom, email ou téléphone"
              [value]="searchTerm()"
              (input)="onSearchInput($event)"
            />
          </span>
        </th>
        <th>
          <p-select
            class="inline-role-select"
            [options]="roleFilterOptions"
            [ngModel]="roleFilter()"
            (ngModelChange)="onRoleFilterChange($event)"
            optionLabel="label"
            optionValue="value"
            placeholder="Tous les rôles"
            [appendTo]="'body'"
          ></p-select>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.fullName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.phone }}</td>
        <td>
          <p-tag [value]="getRoleLabel(user.role)" [severity]="getRoleSeverity(user.role)"></p-tag>
        </td>
        <td>
          <button pButton type="button" icon="pi pi-pencil" class="p-button-text" (click)="editUser(user)" aria-label="Modifier"></button>
          <button pButton type="button" icon="pi pi-trash" class="p-button-text" (click)="deleteUser(user)" aria-label="Supprimer"></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">Aucun utilisateur trouve pour ces filtres.</td>
      </tr>
    </ng-template>
  </p-table>
  </div>

  <p-dialog
    [header]="isEditing() ? 'Modifier utilisateur' : 'Nouvel utilisateur'"
    [modal]="true"
    [visible]="userDialog()"
    [style]="{ width: '32rem' }"
    (visibleChange)="userDialog.set($event)"
  >
    <form class="dialog-form" [formGroup]="userForm" (ngSubmit)="saveUser()">
      <label>
        Nom complet
        <input pInputText type="text" formControlName="fullName" />
      </label>
      <label>
        Email
        <input pInputText type="email" formControlName="email" />
      </label>
      <label>
        Mot de passe {{ isEditing() ? '(laisser vide pour ne pas changer)' : '' }}
        <input pInputText type="password" formControlName="password" />
      </label>
      <label>
        Telephone
        <input pInputText type="tel" formControlName="phone" />
      </label>
      <label>
        Adresse
        <input pInputText type="text" formControlName="address" />
      </label>
      <label>
        Role
        <p-select
          class="dialog-role-select"
          formControlName="role"
          [options]="roleOptions"
          optionLabel="label"
          optionValue="value"
          [appendTo]="'body'"
          placeholder="Selectionner un role"
        ></p-select>
      </label>
    </form>

    <ng-template pTemplate="footer">
      <button pButton type="button" label="Annuler" class="p-button-text" (click)="userDialog.set(false)"></button>
      <button pButton type="button" label="Enregistrer" (click)="saveUser()"></button>
    </ng-template>
  </p-dialog>
</section>
