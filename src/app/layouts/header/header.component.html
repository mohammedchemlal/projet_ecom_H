<!-- header.component.html - Version simplifiée -->
<div class="header" [class.scrolled]="isScrolled">
  <div class="container">
    <div class="header-content">
      <!-- Menu hamburger (toujours visible sur mobile) -->
      <button 
        #mobileBtn 
        class="mobile-menu-btn" 
        type="button" 
        aria-label="Ouvrir le menu" 
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="showMobileMenu">
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>

      <!-- Logo / Nom de l'app (centré sur mobile) -->
      <a class="logo-link" aria-label="Aller à l'accueil">
        <div class="logo">
          <span class="brand">Valerya</span>
          <span class="tagline">House of Jewels</span>
        </div>
      </a>

      <!-- Desktop Navigation (moved inline) -->
      <div class="desktop-nav">
        <p-menubar [model]="items" class="custom-menubar"></p-menubar>
      </div>

      <!-- Actions (favoris, panier, user) -->
      <div class="header-actions">
        <a class="action-btn" aria-label="Favoris" [routerLink]="['/wishlist']">
          <i class="pi pi-heart" aria-hidden="true"></i>
          <span *ngIf="wishlistCount > 0" class="badge">{{ wishlistCount }}</span>
        </a>

        <a class="action-btn cart-btn" aria-label="Panier" [routerLink]="['/cart']">
          <i class="pi pi-shopping-bag" aria-hidden="true"></i>
          <span *ngIf="cartCount > 0" class="badge">{{ cartCount }}</span>
        </a>

        <!-- User dropdown simplifié -->
        <div class="user-dropdown">
          <button class="user-btn" type="button" (click)="toggleUserMenu()">
            <span class="avatar" *ngIf="currentUser; else iconTpl">{{ getInitials(currentUser.fullName) }}</span>
            <ng-template #iconTpl><i class="pi pi-user"></i></ng-template>
          </button>

          <ul class="user-menu" *ngIf="userMenuVisible">
            <li *ngFor="let entry of userMenu">
              <ng-container *ngIf="entry.separator; else itemTpl">
                <hr class="menu-separator" />
              </ng-container>
              <ng-template #itemTpl>
                <button type="button" class="menu-item" (click)="handleUserMenuEntry(entry)">
                  <i *ngIf="entry.icon" [class]="entry.icon"></i>
                    {{ entry.label }}
                    <span *ngIf="entry.label === 'Mes Commandes'" class="menu-badge">{{ ordersCount }}</span>
                </button>
              </ng-template>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- (desktop nav moved inline above) -->

    <!-- Mobile Navigation (flottant) -->
    <nav 
      #mobileNav 
      class="mobile-nav" 
      *ngIf="showMobileMenu" 
      [ngStyle]="{'left.px': mobileNavLeft}">
      <ul class="mobile-menu">
        <li *ngFor="let it of items">
          <ng-container *ngIf="it.routerLink; else mobileBtnTpl">
            <a class="mobile-menu-item" [routerLink]="it.routerLink" (click)="closeMobileMenu()">
              <i *ngIf="it.icon" [class]="it.icon"></i>
              {{ it.label }}
            </a>
          </ng-container>
          <ng-template #mobileBtnTpl>
            <button class="mobile-menu-item" (click)="navigateToItem(it)">
              <i *ngIf="it.icon" [class]="it.icon"></i>
              {{ it.label }}
            </button>
          </ng-template>

          <!-- Sous-menus -->
          <ul *ngIf="it.items" class="mobile-submenu">
            <li *ngFor="let sub of it.items">
              <ng-container *ngIf="sub.routerLink; else mobileSubBtnTpl">
                <a class="mobile-submenu-item" [routerLink]="sub.routerLink" (click)="closeMobileMenu()">
                  {{ sub.label }}
                </a>
              </ng-container>
              <ng-template #mobileSubBtnTpl>
                <button class="mobile-submenu-item" (click)="navigateToItem(sub)">
                  {{ sub.label }}
                </button>
              </ng-template>
            </li>
          </ul>
        </li>
      </ul>
    </nav>
    
    <!-- Overlay pour fermer le menu -->
    <div *ngIf="showMobileMenu" class="mobile-menu-overlay" (click)="closeMobileMenu()"></div>
  </div>
</div>
