<!-- header.component.html -->
<div class="header" [class.scrolled]="isScrolled">
  <div class="container px-3 md:px-5">
    <div class="header-content flex align-items-center justify-content-between gap-3">
      <!-- Logo -->
      <div class="logo flex align-items-center gap-2" routerLink="/home" aria-label="Aller à l'accueil">
        @if (!logoLoadFailed) {
          <img
            src="/valeria-logo.png"
            alt="Valeria House of Jewels"
            class="logo-img"
            decoding="async"
            loading="eager"
            (error)="logoLoadFailed = true"
          />
        }
        <span class="logo-text">
          <span class="brand">Valeria</span>
          <span class="tagline">House of Jewels</span>
        </span>
      </div>

      <!-- Desktop Navigation -->
      <div class="desktop-nav flex-1">
        <p-menubar [model]="items" class="custom-menubar"></p-menubar>
      </div>

      <!-- Actions -->
      <div class="header-actions flex align-items-center gap-2">
        <button class="action-btn" (click)="showSearchBar = !showSearchBar">
          <i class="pi pi-search"></i>
        </button>
        <button class="action-btn" (click)="goToWishlist()">
          <i class="pi pi-heart"></i>
          @if (wishlistCount > 0) {
            <span class="badge">{{ wishlistCount }}</span>
          }
        </button>
        <button class="action-btn cart-btn" (click)="goToCart()">
          <i class="pi pi-shopping-bag"></i>
          @if (cartCount > 0) {
            <span class="badge">{{ cartCount }}</span>
          }
        </button>
        <p-splitButton
          label=""
          [model]="userMenu"
          icon="pi pi-user"
          styleClass="user-btn"
        ></p-splitButton>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar" [class.active]="showSearchBar">
      <div class="search-container flex align-items-center gap-2">
        <i class="pi pi-search search-icon"></i>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="search()"
          placeholder="Rechercher un produit..."
          class="search-input"
        />
        <button class="search-btn" (click)="search()">Rechercher</button>
      </div>
    </div>
  </div>
</div>
